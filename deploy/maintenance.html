<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сервис временно недоступен</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1f1f1f; --muted: #6b6b6b; --link: #1d4ed8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --fg: #ededed; --muted: #a3a3a3; --link: #93b4ff; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px;
    }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
    p { margin: .4rem 0; color: var(--muted); }
    a { color: var(--link); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Сервис временно недоступен</h1>
    <p>Сервер приложения сейчас не на связи. Попробуйте через несколько минут.</p>
    <p>Если не заработало — обратитесь к
      <a href="https://mm.mtsbank.ru/flext-core/messages/@vserkov" target="_blank" rel="noreferrer">Владиславу Серкову</a>
      в Mattermost.</p>
  </main>
</body>
</html>
